
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build


      # Ensure tag commit is on main branch
      - name: Check tag is on main branch
        run: |
          git fetch origin main
          if ! git branch -r --contains $GITHUB_SHA | grep -q 'origin/main'; then
            echo "Tag commit is not on main branch"
            exit 1
          fi
          echo "Tag commit is on main branch"

      # Check tag matches pyproject.toml
      - name: Get version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get version from tag
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check version matches tag
        run: |
          if [ "${{ steps.version.outputs.version }}" != "${{ steps.tag.outputs.tag }}" ]; then
            echo "Version mismatch!"
            echo "pyproject.toml: ${{ steps.version.outputs.version }}"
            echo "tag: ${{ steps.tag.outputs.tag }}"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
